# Raw AI-READI v3.0.0 download, preserving its directory structure.
# Paths are relative to the repository root; absolute paths also work.
dataset_root: data/aireadi
participants: "{dataset_root}/participants.tsv"
clinical_dir: "{dataset_root}/clinical_data"
manifests:
  retinal_photography: "{dataset_root}/retinal_photography/manifest.tsv"
  retinal_oct: "{dataset_root}/retinal_oct/manifest.tsv"
  retinal_octa: "{dataset_root}/retinal_octa/manifest.tsv"
  retinal_flio: "{dataset_root}/retinal_flio/manifest.tsv"
  cardiac_ecg: "{dataset_root}/cardiac_ecg/manifest.tsv"
  environment: "{dataset_root}/environment/manifest.tsv"
  wearable_activity_monitor: "{dataset_root}/wearable_activity_monitor/manifest.tsv"
  wearable_blood_glucose: "{dataset_root}/wearable_blood_glucose/manifest.tsv"
prepared_root: outputs/preprocessed
source_root: outputs/prepared
workers: 8
devices: [0, 1, 2, 3]
num_workers: 2
cpu_threads: 2
cache_people_per_batch: 4
retinal_batch_size: 128
retinal_weights_path: null
