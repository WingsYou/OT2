# Analyze completed Mixed CBMs; never fit models or reprocess inputs.
output_root: outputs/concept_recovery
bank: without_observation
devices: [0, 1, 2, 3]
cpu_threads: 2
num_workers: 0
seed: 42
bootstrap_samples: 10000
tasks:
  - moca_binary
  - cardiovascular_conditions_binary
  - major_cardiovascular_events_binary
  - osteoporosis_history_binary
  - kidney_history_binary
  - lung_history_binary

source_runs:
  without_observation:
    existing_tasks: outputs/study_without_observation
    cardiovascular_tasks: outputs/study_without_observation
  with_observation:
    existing_tasks: outputs/study_with_observation
    cardiovascular_tasks: outputs/study_with_observation
