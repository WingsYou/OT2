# Validation-only full-curated-retinal experiment.  The retinal caps equal the
# observed per-person maxima in the 60,807 successful canonical assets, so no
# canonical asset is omitted by the model-view adapter.
schema_version: ot2-model-v2-1
seed: 42
output_dir: /data/pzhao3/ot2_output/model_full_assets_v1/models/moca_binary/seed42

dataset:
  task: moca_binary
  master_csv: /data/pzhao3/ot2_output/model_full_assets_v1/inputs/master_moca_binary.csv
  master_metadata_json: /data/pzhao3/ot2_output/model_full_assets_v1/inputs/master_moca_binary.metadata.json
  scaler_json: /data/pzhao3/ot2_output/scalers/train_scalers_moca_binary.json
  clinical_schema_json: /data/pzhao3/ot2_output/clinical/moca_binary/clinical_schema_moca_binary.json
  environment_schema_json: /data/pzhao3/ot2_output/environment_v4/environment_5min_schema.json
  wearable_schema_json: /data/pzhao3/ot2_output/wearable_v5/wearable_5min_schema.json
  ecg_schema_json: /data/pzhao3/ot2_output/ecg/ecg_schema.json
  artifact_root: /data/pzhao3/ot2_output
  strict_lineage: true
  allow_missing_modalities: true
  retinal:
    deterministic_selection: true
    max_assets:
      photography: 6
      oct: 2
      octa: 16
      flio: 4

model:
  source_order:
    - clinical_data
    - cardiac_ecg
    - environment
    - retinal_flio
    - retinal_oct
    - retinal_octa
    - retinal_photography
    - wearable_activity_monitor
    - wearable_blood_glucose
  d_model: 256
  dropout: 0.2
  task_heads:
    moca_binary: 1
    cvd_broad_binary: 1
    cvd_strict_binary: 1
  clinical:
    hidden_dims: [512, 256]
  longitudinal:
    patch_size_slots: 12
    layers: 2
    heads: 4
    ff_dim: 512
  ecg:
    patch_size_samples: 100
    layers: 2
    heads: 4
    ff_dim: 512
    combine_numeric_features: true
  retinal:
    backbone: resnet18
    backbone_dim: 512
    weights: IMAGENET1K_V1
    weights_path: null
    frozen: true
    input_size: 224
    normalization: imagenet1k_v1
    backbone_forward_batch_size: 64
    shared_backbone: true
    view_pool: masked_attention
    asset_pool: masked_attention
  fusion:
    layers: 2
    heads: 4
    ff_dim: 512
    use_learned_missing_tokens: true

training:
  evaluation_phase: validation_screen
  initialization_checkpoint: null
  disabled_groups: []
  batch_size: 2
  gradient_accumulation_steps: 16
  max_epochs: 30
  learning_rate: 0.00005
  weight_decay: 0.01
  optimizer: adamw
  scheduler:
    name: cosine_with_linear_warmup
    warmup_ratio: 0.1
    interval: optimizer_step
  grad_clip_norm: 1.0
  use_pos_weight: true
  selection_metric: auroc
  threshold_method: youden
  fixed_threshold: 0.5
  early_stopping_patience: 7
  reload_best_before_test: true
  deterministic: true
  num_workers: 2
  device: auto
  bf16: true

importance:
  methods: [ablation, permutation, matched_permutation]
  permutation_repeats: 200
  bootstrap_samples: 2000
  allow_test_set_model_selection: false
