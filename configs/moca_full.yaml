# Existing processed input locations; no preprocessing is run.
dataset:
  task: moca_binary
  master_csv: "{artifact_root}/model_full_assets_v1/inputs/master_moca_binary.csv"
  master_metadata_json: "{artifact_root}/model_full_assets_v1/inputs/master_moca_binary.metadata.json"
  scaler_json: "{artifact_root}/scalers/train_scalers_moca_binary.json"
  clinical_schema_json: "{artifact_root}/clinical/moca_binary/clinical_schema_moca_binary.json"
  environment_schema_json: "{artifact_root}/environment_v4/environment_5min_schema.json"
  wearable_schema_json: "{artifact_root}/wearable_v5/wearable_5min_schema.json"
  ecg_schema_json: "{artifact_root}/ecg/ecg_schema.json"
  artifact_root: "{artifact_root}"
  strict_lineage: true
  allow_missing_modalities: true
  retinal:
    deterministic_selection: true
    max_assets:
      photography: 6
      oct: 2
      octa: 16
      flio: 4
